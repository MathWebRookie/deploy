name: rsl-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rsl
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    mem_limit: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rsl"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database
      - db_publish

  api:
    image: rsl-prod-api:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/rsl
      JWT_SECRET: ${JWT_SECRET}
      LEDGER_SKILL_API_KEY: ${LEDGER_SKILL_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - hermes_api

volumes:
  pgdata:

networks:
  database:
    internal: true
  db_publish:
    name: rsl-db-publish
  hermes_api:
    name: rsl-hermes-api
