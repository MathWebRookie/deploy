server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name slwithmj.store www.slwithmj.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl http2 default_server;
    server_name slwithmj.store www.slwithmj.store;

    ssl_certificate /etc/letsencrypt/live/slwithmj.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slwithmj.store/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/portal;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/rsl/media/;
        expires 7d;
    }

    location = /rsl {
        return 301 /rsl/;
    }

    location /rsl/ {
        root /var/www;
        try_files $uri $uri/ /rsl/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
