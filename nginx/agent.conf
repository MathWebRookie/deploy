map $http_upgrade $hermes_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.slwithmj.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.slwithmj.store;

    ssl_certificate /etc/letsencrypt/live/agent.slwithmj.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.slwithmj.store/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hermes_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
